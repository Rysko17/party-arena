<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Arena Online</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a10;color:#fff;font-family:Arial,sans-serif}.w{max-width:760px;margin:auto;padding:20px}.card{background:#161620;border:1px solid #30303d;border-radius:24px;padding:22px;margin:14px 0}h1{font-size:clamp(42px,9vw,72px);margin:5px 0}.o{color:#ff6038}.muted{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;min-height:52px;border-radius:14px;border:1px solid #3a3a48;background:#22222d;color:#fff;padding:12px;font-size:16px}button{font-weight:800;cursor:pointer}.primary{background:#ff6038;color:#111;border:0}.hide{display:none}.player{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #30303d}.code{font-size:50px;font-weight:900;letter-spacing:8px}.answer{text-align:left;min-height:70px}.good{outline:3px solid #57d68d}.bad{opacity:.55}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="w">
<section id="home" class="card"><div class="muted">🌍 MULTIJOUEUR EN LIGNE</div><h1>PARTY <span class="o">ARENA</span></h1><p>Joue avec tes amis, même s'ils sont dans une autre ville.</p><input id="name" maxlength="16" placeholder="Ton pseudo"><div class="grid" style="margin-top:10px"><button id="create" class="primary">CRÉER UNE PARTIE</button><button id="joinOpen">REJOINDRE</button></div><div id="joinBox" class="hide" style="margin-top:10px"><input id="roomCode" maxlength="4" placeholder="CODE (ex : 7K9D)"><button id="join" class="primary" style="margin-top:8px">ENTRER DANS LA SALLE</button></div><p id="err" class="o"></p></section>
<section id="lobby" class="card hide"><div class="muted">CODE DE LA SALLE</div><div id="code" class="code"></div><p>Envoie ce code et <b>le lien du site</b> à tes amis.</p><h2>👥 Joueurs</h2><div id="players"></div><button id="start" class="primary hide">LANCER 8 MANCHES ⚡</button><p id="waiting" class="muted">En attente de l'hôte…</p></section>
<section id="game" class="card hide"><div class="muted"><span id="theme"></span> • MANCHE <span id="round"></span>/<span id="total"></span></div><h2 id="question"></h2><div id="answers" class="grid"></div><p id="status" class="muted"></p><h3>🏆 Scores</h3><div id="scores"></div></section>
<section id="end" class="card hide"><h2>🏆 CLASSEMENT FINAL</h2><div id="final"></div><button onclick="location.reload()" class="primary">REJOUER</button></section>
</main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=x=>document.querySelector(x),show=x=>$(x).classList.remove("hide"),hide=x=>$(x).classList.add("hide");let me=null,lastRoom=null;
$("#joinOpen").onclick=()=>show("#joinBox");$("#create").onclick=()=>s.emit("create",$("#name").value||"Hôte");$("#join").onclick=()=>s.emit("join",{code:$("#roomCode").value,name:$("#name").value||"Joueur"});
s.on("connect",()=>me=s.id);s.on("errorMsg",m=>$("#err").textContent=m);
s.on("room",r=>{lastRoom=r;hide("#home");show("#lobby");$("#code").textContent=r.code;$("#players").innerHTML=r.players.map(p=>`<div class="player"><b>${p.name}${p.id===r.host?" 👑":""}</b><span>${p.score} pts</span></div>`).join("");if(me===r.host){show("#start");hide("#waiting")}else{hide("#start");show("#waiting")}renderScores(r)});
$("#start").onclick=()=>s.emit("start");
s.on("question",q=>{hide("#lobby");show("#game");$("#theme").textContent=q.theme;$("#round").textContent=q.round;$("#total").textContent=q.total;$("#question").textContent=q.q;$("#status").textContent="Choisis ta réponse.";$("#answers").innerHTML=q.a.map((a,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join("");$("#answers").querySelectorAll("button").forEach(b=>b.onclick=()=>{s.emit("answer",b.dataset.i);$("#answers").querySelectorAll("button").forEach(x=>x.disabled=true);$("#status").textContent="Réponse envoyée…"})});
s.on("answerResult",r=>{$("#answers").querySelectorAll("button").forEach((b,i)=>{if(i===r.correctIndex)b.classList.add("good");else b.classList.add("bad")});$("#status").textContent=r.correct?"✅ Bonne réponse ! +500 pts":"❌ Mauvaise réponse."});
function renderScores(r){if(!$("#scores"))return;$("#scores").innerHTML=r.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="player"><b>${p.name}</b><span>${p.score} pts ${p.answered?"✓":""}</span></div>`).join("")}
s.on("gameOver",r=>{hide("#game");hide("#lobby");show("#end");$("#final").innerHTML=r.players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><b>${i===0?"👑 ":""}${i+1}. ${p.name}</b><span>${p.score} pts</span></div>`).join("")});
</script></body></html>
