<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Arena V4</title><style>*{box-sizing:border-box}body{margin:0;background:#09090f;color:#fff;font-family:Arial}.w{max-width:800px;margin:auto;padding:18px}.card{background:#171720;border:1px solid #343441;border-radius:22px;padding:22px;margin:12px 0}h1{font-size:clamp(42px,10vw,76px);margin:5px 0}.o{color:#ff5f3b}.muted{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;min-height:52px;border-radius:14px;border:1px solid #41414e;background:#24242f;color:white;padding:12px;font-size:16px}button{font-weight:800;cursor:pointer}.primary{background:#ff5f3b;color:#111;border:0}.hide{display:none}.player{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #30303b}.code{font-size:48px;font-weight:900;letter-spacing:7px}.answer{text-align:left;min-height:66px}.tag{display:inline-block;padding:7px 10px;border:1px solid #555;border-radius:99px;margin:3px}.timer{font-size:58px;font-weight:900;text-align:center}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><section id="home" class="card"><div class="muted">🌍 V4 • MULTI-JEUX ONLINE</div><h1>PARTY <span class="o">ARENA</span></h1><p>Quiz • Tu me connais ? • Majorité • Bombe • Duel • Mot interdit • Défis</p><input id="name" placeholder="Ton pseudo" maxlength="16"><div class="grid" style="margin-top:10px"><button id="create" class="primary">CRÉER UNE PARTIE</button><button id="oj">REJOINDRE</button></div><div id="jb" class="hide"><input id="rc" placeholder="CODE" maxlength="4"><button id="join" class="primary">ENTRER</button></div><p id="err" class="o"></p></section><section id="lobby" class="card hide"><div class="muted">CODE</div><div id="code" class="code"></div><div id="players"></div><button id="start" class="primary hide">LANCER 14 MANCHES ⚡</button><p id="wait">En attente de l'hôte…</p></section><section id="game" class="card hide"><div class="muted"><span id="mode"></span> • <span id="round"></span>/<span id="total"></span></div><h2 id="title"></h2><div id="content"></div><p id="status" class="muted"></p><h3>🏆 Scores</h3><div id="scores"></div></section><section id="end" class="card hide"><h2>🏆 CLASSEMENT FINAL</h2><div id="final"></div><button class="primary" onclick="location.reload()">REJOUER</button></section></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=q=>document.querySelector(q),show=q=>$(q).classList.remove("hide"),hide=q=>$(q).classList.add("hide");let me,room,timer;s.on("connect",()=>me=s.id);$("#oj").onclick=()=>show("#jb");$("#create").onclick=()=>s.emit("create",$("#name").value);$("#join").onclick=()=>s.emit("join",{code:$("#rc").value,name:$("#name").value});$("#start").onclick=()=>s.emit("start");s.on("errorMsg",m=>$("#err").textContent=m);function sc(r){$("#scores").innerHTML=r.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="player"><b>${p.name}</b><span>${p.score} pts ${p.done?"✓":""}</span></div>`).join("")}s.on("room",r=>{room=r;hide("#home");if(!r.started)show("#lobby");$("#code").textContent=r.code;$("#players").innerHTML=r.players.map(p=>`<div class="player"><b>${p.name}${p.id===r.host?" 👑":""}</b><span>${p.score}</span></div>`).join("");if(me===r.host){show("#start");hide("#wait")}else{hide("#start");show("#wait")}sc(r)});function base(x,m,t){clearInterval(timer);hide("#lobby");show("#game");$("#mode").textContent=m;$("#round").textContent=x.round;$("#total").textContent=x.total;$("#title").textContent=t;$("#content").innerHTML="";$("#status").textContent=""}function btn(a,fn){$("#content").innerHTML=`<div class="grid">${a.map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join("")}</div>`;$("#content").querySelectorAll("button").forEach(b=>b.onclick=()=>{fn(+b.dataset.i);$("#content").querySelectorAll("button").forEach(x=>x.disabled=true)})}s.on("quiz",x=>{base(x,"🧠 QUIZ • "+x.theme,x.q);btn(x.a,i=>s.emit("answer",i))});s.on("duel",x=>{base(x,"⚔️ DUEL",x.players.join(" VS ")+" — "+x.q);x.ids.includes(me)?btn(x.a,i=>s.emit("answer",i)):$("#content").innerHTML="<p>👀 Regarde le duel !</p>"});s.on("result",g=>$("#status").textContent=g?"✅ Bonne réponse !":"❌ Raté !");s.on("know",x=>{base(x,"💜 TU ME CONNAIS ?",x.targetName+" : "+x.q);if(me===x.target){$("#status").textContent="🤫 Choisis secrètement.";btn(x.a,i=>s.emit("knowSecret",i))}else{btn(x.a,i=>s.emit("knowGuess",i))}});s.on("secretSaved",()=>$("#status").textContent="🔒 Réponse secrète enregistrée.");s.on("guessResult",g=>$("#status").textContent=g?"🎯 +500 points !":"😈 Mauvaise intuition !");s.on("majority",x=>{base(x,"👥 MAJORITÉ",x.q);btn(x.a,i=>s.emit("vote",i))});s.on("majorityResult",r=>$("#status").textContent=`A : ${r.a} • B : ${r.b}`);s.on("bomb",x=>{base(x,"💣 LA BOMBE",`${x.targetName} doit citer ${x.category}`);let n=15;$("#content").innerHTML=`<div id="t" class="timer">${n}</div>`+(me===room.host?'<div class="grid"><button id="yes" class="primary">VALIDÉ +400</button><button id="no">RATÉ</button></div>':"");timer=setInterval(()=>{n--;if($("#t"))$("#t").textContent=n;if(n<=0){clearInterval(timer);if(me===room.host)s.emit("hostJudge",false)}},1000);if(me===room.host){$("#yes").onclick=()=>s.emit("hostJudge",true);$("#no").onclick=()=>s.emit("hostJudge",false)}});s.on("forbidden",x=>{base(x,"🚫 MOT INTERDIT","Fais deviner : "+x.word);$("#content").innerHTML=x.forbidden.map(w=>`<span class="tag">${w}</span>`).join("")+(me===room.host?'<div class="grid"><button id="yes" class="primary">RÉUSSI</button><button id="no">RATÉ</button></div>':"");if(me===room.host){$("#yes").onclick=()=>s.emit("hostJudge",true);$("#no").onclick=()=>s.emit("hostJudge",false)}});s.on("challenge",x=>{base(x,"🎲 DÉFI",x.text);$("#content").innerHTML=me===room.host?'<div class="grid"><button id="yes" class="primary">RÉUSSI</button><button id="no">RATÉ</button></div>':"";if(me===room.host){$("#yes").onclick=()=>s.emit("hostJudge",true);$("#no").onclick=()=>s.emit("hostJudge",false)}});s.on("gameOver",r=>{clearInterval(timer);hide("#game");hide("#lobby");show("#end");$("#final").innerHTML=r.players.slice().sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="player"><b>${i===0?"👑 ":""}${i+1}. ${p.name}</b><span>${p.score} pts</span></div>`).join("")});
</script></body></html>
